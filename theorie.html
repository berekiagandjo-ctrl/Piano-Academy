<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Piano Academy — Théorie</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
  min-height:100vh;
  padding:16px;
}

.app{
  max-width:560px;
  margin:auto;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back{
  width:44px;
  height:44px;
  border:0;
  border-radius:13px;
  background:#334155;
  color:#fff;
  font-size:22px;
}

.header h1{
  font-size:21px;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  padding:22px;
  border-radius:23px;
  margin-bottom:18px;
}

.hero h2{
  margin-bottom:8px;
}

.hero p{
  color:#e2e8f0;
  line-height:1.6;
}

/* PROGRESSION */

.global{
  background:#1e293b;
  border:1px solid #334155;
  padding:16px;
  border-radius:19px;
  margin-bottom:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:8px;
}

.bar{
  height:8px;
  background:#334155;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:#8b5cf6;
  transition:.4s;
}

/* NIVEAU */

.level{
  background:#111c31;
  border:1px solid #334155;
  border-radius:22px;
  margin-bottom:15px;
  overflow:hidden;
}

.level-head{
  padding:18px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
}

.level-num{
  width:49px;
  height:49px;
  border-radius:15px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  display:grid;
  place-items:center;
  font-weight:bold;
}

.level.locked{
  opacity:.62;
}

.level.locked .level-head{
  cursor:not-allowed;
}

.level-info{
  flex:1;
}

.level-info h2{
  font-size:17px;
  margin-bottom:4px;
}

.level-info p{
  font-size:12px;
  color:#94a3b8;
}

.level-arrow{
  font-size:18px;
}

.level.open .level-arrow{
  transform:rotate(180deg);
}

.level-body{
  display:none;
  padding:0 12px 15px;
}

.level.open .level-body{
  display:block;
}

.level-progress{
  background:#0f172a;
  padding:11px 13px;
  border-radius:14px;
  margin-bottom:12px;
}

/* MODULES */

.modules{
  display:grid;
  gap:10px;
}

.module{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:17px;
  overflow:hidden;
}

.module.done{
  border-color:#16a34a;
}

.module-head{
  padding:14px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
}

.module-num{
  width:39px;
  height:39px;
  border-radius:12px;
  background:#334155;
  display:grid;
  place-items:center;
  font-weight:bold;
  flex-shrink:0;
}

.done .module-num{
  background:#16a34a;
}

.module-info{
  flex:1;
}

.module-info h3{
  font-size:14px;
  margin-bottom:3px;
}

.module-info p{
  font-size:11px;
  color:#94a3b8;
  line-height:1.4;
}

.module-body{
  display:none;
  border-top:1px solid #334155;
  padding:15px;
}

.module.open .module-body{
  display:block;
}

/* LEÇON */

.lesson{
  margin-bottom:15px;
}

.lesson h4{
  color:#c4b5fd;
  font-size:14px;
  margin-bottom:7px;
}

.lesson p{
  color:#dbe4ef;
  font-size:14px;
  line-height:1.7;
}

/* ILLUSTRATIONS */

.visual{
  white-space:pre-wrap;
  background:#0b1120;
  border:1px solid #334155;
  border-radius:14px;
  padding:14px;
  text-align:center;
  color:#c4b5fd;
  font-family:monospace;
  margin:12px 0;
  line-height:1.7;
  overflow:auto;
}

.tip{
  background:#312e81;
  padding:12px;
  border-radius:12px;
  color:#ede9fe;
  font-size:13px;
  line-height:1.6;
}

/* BOUTON */

.complete{
  width:100%;
  border:0;
  background:#7c3aed;
  color:white;
  padding:13px;
  border-radius:13px;
  font-weight:bold;
  margin-top:10px;
}

.status{
  color:#4ade80;
  text-align:center;
  font-size:12px;
  margin-top:8px;
  display:none;
}

/* EVALUATION */

.exam{
  margin-top:10px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  padding:18px;
  border-radius:20px;
}

.exam h3{
  margin-bottom:6px;
}

.exam p{
  font-size:13px;
  color:#e2e8f0;
  line-height:1.5;
  margin-bottom:12px;
}

.exam button,
.primary{
  width:100%;
  border:0;
  padding:13px;
  border-radius:13px;
  font-weight:bold;
  background:#fff;
  color:#6d28d9;
}

/* MODAL QUIZ */

.modal{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.92);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10;
}

.modal.show{
  display:flex;
}

.quiz{
  width:100%;
  max-width:520px;
  background:#1e293b;
  border:1px solid #475569;
  border-radius:22px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.quiz h2{
  margin-bottom:7px;
}

.quiz-sub{
  color:#94a3b8;
  font-size:13px;
  margin-bottom:18px;
}

.question{
  margin-bottom:18px;
}

.question b{
  display:block;
  line-height:1.5;
  margin-bottom:9px;
}

.answer{
  width:100%;
  text-align:left;
  border:1px solid #475569;
  background:#0f172a;
  color:#fff;
  padding:11px;
  border-radius:11px;
  margin:5px 0;
}

.answer.selected{
  border-color:#8b5cf6;
  background:#312e81;
}

.result{
  text-align:center;
  margin:14px 0;
  font-weight:bold;
}

.close{
  width:100%;
  border:0;
  background:#334155;
  color:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:8px;
}

.lockmsg{
  font-size:11px;
  color:#fbbf24;
  margin-top:4px;
}

.footer{
  text-align:center;
  color:#64748b;
  padding:25px 0;
  font-size:12px;
  line-height:1.7;
}
</style>
</head>

</div>

/* =====================================================
   VARIABLES
===================================================== */

const KEY_PREFIX="pianoAcademy_";

let currentLevel=0;
let answers=[];


/* =====================================================
   SAUVEGARDE
===================================================== */

function doneKey(level,module){

return KEY_PREFIX+
"L"+level+
"M"+module;

}


function levelPassed(level){

return localStorage.getItem(
KEY_PREFIX+"level"+level
)==="passed";

}


function isLevelUnlocked(level){

if(level===0){
return true;
}

return levelPassed(level-1);

}


function countDone(level){

return levels[level].modules.filter(
(_,module)=>
localStorage.getItem(
doneKey(level,module)
)==="done"
).length;

}


function levelPercent(level){

return Math.round(
countDone(level)/
levels[level].modules.length*
100
);

}


/* =====================================================
   AFFICHAGE
===================================================== */

function render(){

const root=document.getElementById("levels");

root.innerHTML="";


levels.forEach((level,levelIndex)=>{

const unlocked=
isLevelUnlocked(levelIndex);

const percent=
levelPercent(levelIndex);

const box=
document.createElement("section");

box.className=
"level"+
(
unlocked &&
levelIndex===0
?" open":""
)+
(
unlocked
?""
:" locked"
);

box.id=
"level"+levelIndex;


box.innerHTML=`

<div class="level-head"
onclick="${
unlocked
?`toggleLevel(${levelIndex})`
:""
}">

<div class="level-num">

${unlocked?"🔓":"🔒"}

${levelIndex+1}

</div>

<div class="level-info">

<h2>
${level.title}
</h2>

<p>
${level.desc}
</p>

${
!unlocked
?
`<div class="lockmsg">
🔒 Réussis le niveau précédent pour débloquer celui-ci.
</div>`
:""
}

</div>

<div class="level-arrow">

${unlocked?"▼":""}

</div>

</div>


<div class="level-body">

<div class="level-progress">

<div class="row">

<span>
Progression
</span>

<b>
${percent}%
</b>

</div>

<div class="bar">

<div
class="fill"
style="width:${percent}%">
</div>

</div>

</div>


<div class="modules"></div>


<div class="exam">

<h3>
📝 Évaluation du niveau ${levelIndex+1}
</h3>

<p>

Termine les 12 modules puis passe
l'évaluation.

Il faut obtenir au moins
80 % pour réussir le niveau.

</p>

<button
onclick="openQuiz(${levelIndex})">

${
levelPassed(levelIndex)
?
"🏆 Niveau réussi"
:
"🎯 Passer l'évaluation"
}

</button>

</div>

</div>
`;


root.appendChild(box);


const modules=
box.querySelector(".modules");


level.modules.forEach(
(module,moduleIndex)=>{

const isDone=
localStorage.getItem(
doneKey(
levelIndex,
moduleIndex
)
)==="done";


const element=
document.createElement("article");


element.className=
"module"+
(
isDone
?" done"
:""
);


element.innerHTML=`

<div
class="module-head"
onclick="toggleModule(this)"
>

<div class="module-num">

${isDone?"✓":moduleIndex+1}

</div>


<div class="module-info">

<h3>

${module.icon}

${module.title}

</h3>

<p>

${module.desc}

</p>

</div>

<span>
▼
</span>

</div>


<div class="module-body">


<div class="lesson">

<h4>
📚 Leçon
</h4>

<p>
${module.text}
</p>

</div>


<div class="visual">

${escapeHtml(module.visual)}

</div>


<div class="lesson">

<h4>
🧠 À retenir
</h4>

<div class="tip">

Comprends la notion,
joue-la lentement au piano,
puis répète-la plusieurs fois.

La compréhension théorique doit
toujours être suivie d'une
application pratique.

</div>

</div>


<div class="lesson">

<h4>
🎯 Mini-défi
</h4>

<p>

Explique cette notion avec tes
propres mots puis applique-la
immédiatement sur ton clavier.

Si tu peux la jouer et l'expliquer,
le module est acquis.

</p>

</div>


<button
class="complete"
onclick="completeModule(
${levelIndex},
${moduleIndex}
)">

${
isDone
?
"✓ Module terminé"
:
"✓ J'ai terminé ce module"
}

</button>


<div
class="status"
style="
display:${isDone?"block":"none"}
">

Module validé ✅

</div>


</div>
`;

modules.appendChild(element);

});

});


updateGlobal();

}


/* =====================================================
   UTILITAIRES
===================================================== */

function escapeHtml(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


function toggleLevel(level){

document
.getElementById("level"+level)
.classList.toggle("open");

}


function toggleModule(header){

header
.parentElement
.classList.toggle("open");

}


/* =====================================================
   TERMINER MODULE
===================================================== */

function completeModule(level,module){

localStorage.setItem(
doneKey(level,module),
"done"
);

render();


document
.getElementById("level"+level)
.classList.add("open");


const modules=
document.querySelectorAll(
"#level"+level+" .module"
);


if(modules[module]){

modules[module]
.classList.add("open");

}

}


/* =====================================================
   PROGRESSION GÉNÉRALE
===================================================== */

function updateGlobal(){

let total=0;

let done=0;


levels.forEach(
(level,levelIndex)=>{

total+=
level.modules.length;

done+=
countDone(levelIndex);

});


const percent=
Math.round(done/total*100);


document
.getElementById("globalPct")
.textContent=
percent+"%";


document
.getElementById("globalFill")
.style.width=
percent+"%";

}


/* =====================================================
   OUVRIR ÉVALUATION
===================================================== */

function openQuiz(level){

if(countDone(level)<12){

alert(
"📚 Termine d'abord les 12 modules de ce niveau."
);

return;

}


currentLevel=level;


answers=
new Array(
quizzes[level].length
).fill(null);


document
.getElementById("quizTitle")
.textContent=
"📝 Évaluation — Niveau "+
(level+1);


document
.getElementById("quizSub")
.textContent=
"80 % minimum pour réussir le niveau.";


const content=
document.getElementById(
"quizContent"
);

content.innerHTML="";


quizzes[level].forEach(
(question,index)=>{

const div=
document.createElement("div");

div.className="question";


div.innerHTML=
"<b>"+
(index+1)+
". "+
question.q+
"</b>";


question.a.forEach(
(answer,answerIndex)=>{

const button=
document.createElement("button");

button.className="answer";

button.textContent=
answer;


button.onclick=()=>{

answers[index]=
answerIndex;


div
.querySelectorAll(".answer")
.forEach(
item=>
item.classList
.remove("selected")
);


button.classList
.add("selected");

};


div.appendChild(button);

});


content.appendChild(div);

});


document
.getElementById("quizResult")
.textContent="";


document
.getElementById("quizModal")
.classList.add("show");

}


/* =====================================================
   VALIDER ÉVALUATION
===================================================== */

function submitQuiz(){

if(
answers.some(
answer=>answer===null
)
){

document
.getElementById("quizResult")
.textContent=
"⚠️ Réponds à toutes les questions.";

return;

}


let score=0;


quizzes[currentLevel]
.forEach(
(question,index)=>{

if(
answers[index]===
question.correct
){

score++;

}

});


const percent=
Math.round(
score/
quizzes[currentLevel].length*
100
);


const result=
document.getElementById(
"quizResult"
);


if(percent>=80){

localStorage.setItem(
KEY_PREFIX+
"level"+
currentLevel,
"passed"
);


result.textContent=
"🏆 Réussi ! "+
percent+
"% — Niveau suivant débloqué.";


render();

}else{

result.textContent=
"❌ "+
percent+
"%. Il faut au moins 80 %. Revois les modules puis réessaie.";

}

}


/* =====================================================
   FERMER QUIZ
===================================================== */

function closeQuiz(){

document
.getElementById("quizModal")
.classList
.remove("show");

}


/* =====================================================
   LANCEMENT
===================================================== */

render();

</script>
