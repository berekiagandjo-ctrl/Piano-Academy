/* =========================================================
   RESET

/* =========================================================
   APPLICATION — PAYSAGE
========================================================= */

/* =========================================================

========================================================= */

========================================================= */

<script>

/* =====================================================
   AUDIO
===================================================== */

let audioContext=null;
let masterGain=null;

let volume=.7;
let powered=true;

let sustain=false;
let dual=false;
let harmony=false;

let tempo=80;

let recording=false;
let metronome=false;

let metronomeTimer=null;

const activeNotes={};
const pointerNotes={};


/* =====================================================
   VOICES
===================================================== */

const voices={

    piano:{
        wave:"sine",
        volume:.72
    },

    electric:{
        wave:"triangle",
        volume:.55
    },

    organ:{
        wave:"square",
        volume:.25
    },

    strings:{
        wave:"sawtooth",
        volume:.18
    },

    synth:{
        wave:"square",
        volume:.25
    },

    bass:{
        wave:"sine",
        volume:.55
    }

};


/* =====================================================
   FREQUENCES
===================================================== */

const frequencies={

    "C":261.6256,
    "C#":277.1826,
    "D":293.6648,
    "D#":311.1270,
    "E":329.6276,
    "F":349.2282,
    "F#":369.9944,
    "G":391.9954,
    "G#":415.3047,
    "A":440,
    "A#":466.1638,
    "B":493.8833

};


/* =====================================================
   AUDIO INIT
===================================================== */

function initAudio(){

    if(!audioContext){

        audioContext=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

        masterGain=
        audioContext.createGain();

        masterGain.gain.value=
        volume;

        masterGain.connect(
            audioContext.destination
        );
    }

    if(
        audioContext.state==="suspended"
    ){

        audioContext.resume();

    }

}


/* =====================================================
   FREQUENCE
===================================================== */

function getFrequency(note){

    const match=
    note.match(/^([A-G]#?)(\d)$/);

    if(!match)
        return 440;

    const name=match[1];

    const octave=
    parseInt(match[2]);

    return frequencies[name]*
    Math.pow(
        2,
        octave-4
    );

}


/* =====================================================
   NOTE + INTERVALLE
===================================================== */

function noteWithSemitones(
    note,
    semitones
){

    const match=
    note.match(/^([A-G]#?)(\d)$/);

    if(!match)
        return note;

    const names=[

        "C","C#","D","D#",
        "E","F","F#","G",
        "G#","A","A#","B"

    ];

    let index=
    names.indexOf(match[1])
    +
    semitones;

    let octave=
    parseInt(match[2]);


    while(index>=12){

        index-=12;

        octave++;

    }


    while(index<0){

        index+=12;

        octave--;

    }


    return names[index]+octave;

}


/* =====================================================
   CRÉATION DU PIANO 61 TOUCHES
===================================================== */

function createPiano(){

    const keyboard=
    document.getElementById(
        "keyboard"
    );

    keyboard.innerHTML="";


    const whiteKeys=[];


    /* 35 touches blanches
       C2 → B6 */

    for(
        let octave=2;
        octave<=6;
        octave++
    ){

        const whiteNames=[
            "C","D","E",
            "F","G","A","B"
        ];


        whiteNames.forEach(
            name=>{

                const key=
                document.createElement(
                    "div"
                );

                key.className="white";

                key.dataset.note=
                name+octave;

                key.textContent=
                name;

                keyboard.appendChild(
                    key
                );

                whiteKeys.push(
                    key
                );

            }
        );

    }


    /* C7 */

    const last=
    document.createElement(
        "div"
    );

    last.className="white";

    last.dataset.note="C7";

    last.textContent="C";

    keyboard.appendChild(
        last
    );

    whiteKeys.push(
        last
    );


    /* TOUCHES NOIRES */

    for(
        let octave=2;
        octave<=6;
        octave++
    ){

        const base=
        (octave-2)*7;


        const positions=[

            {
                name:"C#",
                after:0
            },

            {
                name:"D#",
                after:1
            },

            {
                name:"F#",
                after:3
            },

            {
                name:"G#",
                after:4
            },

            {
                name:"A#",
                after:5
            }

        ];


        positions.forEach(
            item=>{

                const key=
                document.createElement(
                    "div"
                );

                key.className="black";

                key.dataset.note=
                item.name+octave;

                key.textContent=
                item.name;


                const left=
                (
                    (
                        base+
                        item.after+
                        1
                    )/36
                )*100;


                key.style.left=
                `calc(${left}% - 12.5px)`;


                keyboard.appendChild(
                    key
                );

            }
        );

    }


    activateKeys();

}


/* =====================================================
   VOICE
===================================================== */

function getVoice(){

    return document
        .getElementById("voice")
        .value;

}


/* =====================================================
   DUAL VOICE
===================================================== */

function getDualVoice(){

    const list=[

        "piano",
        "electric",
        "organ",
        "strings",
        "synth",
        "bass"

    ];


    const main=
    getVoice();


    let index=
    list.indexOf(main);


    index++;


    if(
        index>=list.length
    ){

        index=0;

    }


    return list[index];

}


/* =====================================================
   CRÉER UN SON
===================================================== */

function createSound(
    note,
    voiceName
){

    const voice=
    voices[voiceName];

    if(!voice)
        return null;


    const osc=
    audioContext.createOscillator();

    const gain=
    audioContext.createGain();


    osc.type=
    voice.wave;


    osc.frequency.value=
    getFrequency(note);


    const now=
    audioContext.currentTime;


    gain.gain.setValueAtTime(
        0,
        now
    );


    gain.gain.linearRampToValueAtTime(
        voice.volume,
        now+.025
    );


    osc.connect(gain);

    gain.connect(masterGain);

    osc.start();


    return{

        osc:osc,

        gain:gain

    };

}


/* =====================================================
   JOUER NOTE
===================================================== */

function playNote(
    note,
    element
){

    if(!powered)
        return;


    initAudio();


    if(activeNotes[note])
        return;


    const sounds=[];


    const main=
    createSound(
        note,
        getVoice()
    );


    if(main)
        sounds.push(main);


    /* DUAL */

    if(dual){

        const second=
        createSound(
            note,
            getDualVoice()
        );


        if(second)
            sounds.push(second);

    }


    /* HARMONIE */

    if(harmony){

        const third=
        noteWithSemitones(
            note,
            4
        );


        const fifth=
        noteWithSemitones(
            note,
            7
        );


        const thirdSound=
        createSound(
            third,
            getVoice()
        );


        const fifthSound=
        createSound(
            fifth,
            getVoice()
        );


        if(thirdSound)
            sounds.push(thirdSound);


        if(fifthSound)
            sounds.push(fifthSound);

    }


    activeNotes[note]={

        sounds:sounds,

        sustained:false,

        element:element

    };


    element.classList.add(
        "active"
    );


    const voiceName=
    document
    .getElementById("voice")
    .selectedOptions[0]
    .text;


    document.getElementById(
        "displayMain"
    ).textContent=
    voiceName;


    document.getElementById(
        "voiceInfo"
    ).textContent=
    "Voice: "+voiceName;


    document.getElementById(
        "pianoStatus"
    ).textContent=
    note+
    (
        harmony
        ?" • HARMONIE"
        :
        dual
        ?" • DUAL"
        :
        " • "+voiceName
    );

}


/* =====================================================
   STOP NOTE
===================================================== */

function stopNote(
    note,
    element
){

    const active=
    activeNotes[note];


    if(!active)
        return;


    if(element){

        element.classList.remove(
            "active"
        );

    }


    if(sustain){

        active.sustained=true;

        return;

    }


    releaseSound(note);

}


/* =====================================================
   RELEASE
===================================================== */

function releaseSound(note){

    const active=
    activeNotes[note];


    if(!active)
        return;


    const now=
    audioContext.currentTime;


    active.sounds.forEach(
        sound=>{

            try{

                sound.gain.gain
                .cancelScheduledValues(
                    now
                );


                sound.gain.gain
                .setValueAtTime(
                    sound.gain.gain.value,
                    now
                );


                sound.gain.gain
                .linearRampToValueAtTime(
                    0,
                    now+.12
                );


                sound.osc.stop(
                    now+.14
                );

            }catch(e){}

        }
    );


    delete activeNotes[note];

}


/* =====================================================
   SUSTAIN
===================================================== */

function releaseAllSustain(){

    Object.keys(
        activeNotes
    ).forEach(
        note=>{

            if(
                activeNotes[note]
                .sustained
            ){

                releaseSound(
                    note
                );

            }

        }
    );

}


/* =====================================================
   TROUVER TOUCHE
===================================================== */

function getKeyAtPosition(
    x,
    y
){

    const elements=
    document.elementsFromPoint(
        x,
        y
    );


    for(
        const element
        of elements
    ){

        if(
            element.classList &&
            (
                element.classList
                .contains("black")
                ||
                element.classList
                .contains("white")
            )
        ){

            return element;

        }

    }


    return null;

}


/* =====================================================
   POINTER NOTE
===================================================== */

function startPointerNote(
    pointerId,
    key
){

    if(!key)
        return;


    const note=
    key.dataset.note;


    if(!note)
        return;


    if(
        pointerNotes[pointerId] &&
        pointerNotes[pointerId].note
        ===note
    ){

        return;

    }


    if(
        pointerNotes[pointerId]
    ){

        const old=
        pointerNotes[pointerId];


        stopNote(
            old.note,
            old.element
        );

    }


    playNote(
        note,
        key
    );


    pointerNotes[pointerId]={

        note:note,

        element:key

    };

}


/* =====================================================
   STOP POINTER
===================================================== */

function stopPointerNote(
    pointerId
){

    const current=
    pointerNotes[pointerId];


    if(!current)
        return;


    stopNote(
        current.note,
        current.element
    );


    delete pointerNotes[
        pointerId
    ];

}


/* =====================================================
   TOUCHES DU PIANO
===================================================== */

function activateKeys(){

    const keyboard=
    document.getElementById(
        "keyboard"
    );


    keyboard.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();


            try{

                keyboard.setPointerCapture(
                    e.pointerId
                );

            }catch(err){}


            const key=
            getKeyAtPosition(
                e.clientX,
                e.clientY
            );


            if(!key)
                return;


            startPointerNote(
                e.pointerId,
                key
            );

        }
    );


    keyboard.addEventListener(
        "pointermove",
        function(e){

            e.preventDefault();


            const key=
            getKeyAtPosition(
                e.clientX,
                e.clientY
            );


            if(!key){

                stopPointerNote(
                    e.pointerId
                );

                return;

            }


            startPointerNote(
                e.pointerId,
                key
            );

        }
    );


    keyboard.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            stopPointerNote(
                e.pointerId
            );

        }
    );


    keyboard.addEventListener(
        "pointercancel",
        function(e){

            stopPointerNote(
                e.pointerId
            );

        }
    );

}


/* =====================================================
   GLISSER LE CLAVIER
===================================================== */

const keyboardDrag=
document.getElementById(
    "keyboardDrag"
);

const keyboardWindow=
document.getElementById(
    "keyboardWindow"
);


let draggingKeyboard=false;

let dragStartX=0;

let dragStartScroll=0;


keyboardDrag.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();


        draggingKeyboard=true;


        dragStartX=
        e.clientX;


        dragStartScroll=
        keyboardWindow.scrollLeft;


        try{

            keyboardDrag.setPointerCapture(
                e.pointerId
            );

        }catch(err){}

    }
);


keyboardDrag.addEventListener(
    "pointermove",
    function(e){

        if(
            !draggingKeyboard
        )
            return;


        e.preventDefault();


        const movement=
        e.clientX-
        dragStartX;


        keyboardWindow.scrollLeft=
        dragStartScroll-
        movement;


        updateOctaveDisplay();

    }
);


keyboardDrag.addEventListener(
    "pointerup",
    function(e){

        draggingKeyboard=false;


        try{

            keyboardDrag.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}

    }
);


keyboardDrag.addEventListener(
    "pointercancel",
    function(){

        draggingKeyboard=false;

    }
);


/* =====================================================
   AFFICHAGE OCTAVE
===================================================== */

function updateOctaveDisplay(){

    const scroll=
    keyboardWindow.scrollLeft;


    const max=
    keyboardWindow.scrollWidth-
    keyboardWindow.clientWidth;


    if(max<=0)
        return;


    const percentage=
    scroll/max;


    let octave=2;


    if(
        percentage>.20
    )
        octave=3;


    if(
        percentage>.40
    )
        octave=4;


    if(
        percentage>.60
    )
        octave=5;


    if(
        percentage>.80
    )
        octave=6;


    document.getElementById(
        "pianoStatus"
    ).textContent=
    "OCTAVE "+
    octave+
    " • GLISSER";

}

/* =====================================================
   METRONOME
===================================================== */

function metronomeClick(){

    if(!metronome)
        return;


    initAudio();


    const osc=
    audioContext
    .createOscillator();


    const gain=
    audioContext
    .createGain();


    osc.frequency.value=
    1000;


    gain.gain.value=
    .15;


    osc.connect(gain);

    gain.connect(
        masterGain
    );


    osc.start();


    osc.stop(
        audioContext
        .currentTime+.06
    );

}


function startMetronome(){

    stopMetronome();


    if(!metronome)
        return;


    const interval=
    60000/tempo;


    metronomeTimer=
    setInterval(
        metronomeClick,
        interval
    );


    metronomeClick();

}


function stopMetronome(){

    if(
        metronomeTimer
    ){

        clearInterval(
            metronomeTimer
        );

        metronomeTimer=null;

    }

}

    metronome=!metronome;


    document
    .getElementById(
        "metronomeCenterBtn"

    :"METRO<br>OFF";


    document.getElementById(
        "displayMain"
    ).textContent=
    metronome
    ?"METRONOME ON"
    :"GRAND PIANO";


    if(metronome)
        startMetronome();
    else
        stopMetronome();

}
